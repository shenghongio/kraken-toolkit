# .kraken_global_deploy.yml - 全局部署配置（YAML格式）
deploy_user: kraken    # 部署用户
ssh_user: root         # SSH 登录用户
ssh_key: /root/.ssh/id_rsa

# 节点列表，每个节点可指定 IP 和可选的密码（若不使用密钥认证）
nodes:
  - ip: 192.168.1.10    # 默认第一个IP为部署操作节点 角色为 master/node
    # password: your_password_here   # 注释掉即无密码
  - ip: 192.168.1.11
    password: pass_for_this_node
  - ip: 192.168.1.12
    # 也可不写 password 字段